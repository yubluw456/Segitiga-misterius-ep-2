name: Render video

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx remotion still src/index.ts CastPreview out/cast.png
      - run: npx remotion render src/index.ts SegitigaMisteriusProlog out/prolog.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: hasil
          path: |
            out/cast.png
            out/prolog.mp4
