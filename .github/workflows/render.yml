name: Render video

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx remotion render src/index.ts SegitigaMisteriusEp3 out/episode3.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: episode3
          path: out/episode3.mp4
